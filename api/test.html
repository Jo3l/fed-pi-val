<script>
	/// json editor https://rawgit.com/jdorn/json-editor/master/examples/advanced.html
	function jsonpress(e) {
		if (e.keyCode==13 && !e.shiftKey) {
			$('#jsoneditor').append('<tr><td id="newtd" contenteditable></td><td contenteditable></td></tr>').find('td').keydown(jsonpress);
			$('#newtd').attr('id',null).focus();
			return false; 
		}
	}
	function selchg(e) {
		$('#url')[0].value= this.value
	}
	function init() { 
		$('#jsoneditor td').keydown(jsonpress);
		$('#urls').on('change', function(e) { $('#url')[0].value= $('form')[0].action= e.target.value; } );
		$('#url').on('change', function(e) { $('form')[0].action= e.target.value; } );
	}
	$(document).ready(init);
</script>
