{data:"20170325","local":"Savipecho CPV Oliva A","visitant":"CPV Xeraco A","reslocal":40,"resvisitant":35},

{data:"20170304","local":"CPV Planes A","visitant":"CPV Nou Villalonga","reslocal":40,"resvisitant":10}
];

function guardar() {
    function $(elm) { return document.getElementById(elm).value; }
    obj= { 'data':'20180116','local':$('local'), 'visitant':$('visitant'), 'reslocal':$('reslocal'), 'resvisitant':$('resvisitant') }
    console.log(obj)
    document.getElementById('reslocal').value= document.getElementById('resvisitant').value= '0';
    pp.push(obj);
    run();
}
    
var equips= {};
        
function clava(obj) { equips[obj.nom]= obj; }

function map(a) { 
    if(!(a.local in equips)) clava({'nom':a.local, 'pj':0, 'pg':0, 'jf':0, 'jc':0, 'punts':0 });
    if(!(a.visitant in equips)) clava({'nom':a.visitant, 'pj':0, 'pg':0, 'jf':0, 'jc':0, 'punts':0 });
    equips[a.local].pj++;
    equips[a.visitant].pj++;
    equips[a.local].jf+= a.reslocal;
    equips[a.local].jc+= a.resvisitant;
    equips[a.visitant].jf+= a.resvisitant;
    equips[a.visitant].jc+= a.reslocal;
    if (a.reslocal>a.resvisitant) equips[a.local].pg++; else equips[a.visitant].pg++;
    // Cada partida es juga a 40, i el guanyador s'emporta 3 punts si el perdedor no aplega a 30.
    // Si el perdedor aplega a 30 suma un punt, i el guanyador els dos punts restants.
    // Galotxa senior: a 70, puntuen a 50
    // Galotxa juvenil: a 50, puntuen a 40
    // Raspall trios: a 40, puntuen a 30 (aquest cas)
    // Raspall parelles: a 25, puntuen a 20
    // Frontó...
    // Escala i corda...
    var minimperpuntuar= parseInt(document.getElementById('minimperpuntuar').value); /// raspall trio
    var puntslocal=  ( a.reslocal>a.resvisitant ? 2 : (a.reslocal>=minimperpuntuar ? 1 : 0 ) ) + ( a.resvisitant<minimperpuntuar ? 1 : 0 );
    equips[a.local].punts+= puntslocal;
    var puntsvisitant= ( a.resvisitant>a.reslocal ? 2 : (a.resvisitant>=minimperpuntuar ? 1 : 0 ) ) + ( a.reslocal<minimperpuntuar ? 1 : 0 );
    equips[a.visitant].punts+= puntsvisitant;
    console.log([a.local,a.visitant,a.reslocal+'-'+a.resvisitant,puntslocal+':'+puntsvisitant])
}

function run() {
    equips= {};
    // genere dades:
    pp.forEach(map);
    // cree array ordenat per puntuació
    equips= Object.values(equips).sort(function(a,b){return a.punts<b.punts;});
    //equips= Object.assign(...equips.map( (v,i) => ({[i]: {'nom':v}}) ));
    var pos=1;
    tabla='<table><tr><td>Pos</td><td>Equip</td><td>PJ</td><td>PG</td><td>JF</td><td>JC</td><td>Punts</td></tr>';
    equips.forEach( (a) => tabla+='<tr><td>'+(pos++)+'</td><td>'+a.nom+'</td><td>'+a.pj+'</td><td>'+a.pg+'</td><td>'+a.jf+'</td><td>'+a.jc+'</td><td>'+a.punts+'</td></tr>' );
    document.getElementById('genera').innerHTML= tabla+'</table>';
}
run();
</script>
