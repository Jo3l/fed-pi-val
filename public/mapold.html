<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8' />
<title>Display a map</title>
<meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
<script src='https://api.tiles.mapbox.com/mapbox-gl-js/v0.49.0/mapbox-gl.js'></script>
<link href='https://api.tiles.mapbox.com/mapbox-gl-js/v0.49.0/mapbox-gl.css' rel='stylesheet' />
<style>
body { margin:0; padding:0; }
#map { position:absolute; top:0; bottom:0; width:100%; }
</style>
</head>
<body>
 
<div id='map'></div>
<script>
var loc= location.search.substr(1);
var admin= false;

if(loc.indexOf('&admin')>=0) {
	loc= loc.replace(/&admin/,'');
	admin= true;
}

function get(url) {
	var xmlhttp = new XMLHttpRequest();
	xmlhttp.onreadystatechange = function() {
	  if (this.readyState == 4 && this.status == 200) {
	    var json= JSON.parse(this.responseText);
	    var coords= [json.features[0].center[0],json.features[0].center[1]];
	    pos(coords);
	  }
	};
	xmlhttp.open('GET', url);
	xmlhttp.send();	
}

mapboxgl.accessToken = 'pk.eyJ1IjoiYWxzYW5hbiIsImEiOiJjaW50dzlibTAwMGt0dnZseTJ1d2NkZWI3In0.FI0VWKvVV3oU4DblKsussw';
const map = new mapboxgl.Map({
container: 'map',
style: 'mapbox://styles/alsanan/cjoq4paa82j882rs2609rdcfa',
center: [-0.4018033,39.4775018],
pitch: 60,
zoom: 15.4
});

var marker= null;

// 39.454124, -0.388633
if ( /-?[0-9]{1,3}[.][0-9]+\,\s*-?[0-9]{1,3}[.][0-9]+/.test( loc ) ) {
	loc= loc.split(',');
	pos([loc[0],loc[1]])
	// ja son coordinades gps
} else get("https://api.mapbox.com/geocoding/v5/mapbox.places/"+loc+".json?types=address&access_token=pk.eyJ1IjoiYWxzYW5hbiIsImEiOiJjaW50dzlibTAwMGt0dnZseTJ1d2NkZWI3In0.FI0VWKvVV3oU4DblKsussw");


map.on('click', function (e) {
	if (!admin) return;
	console.log(e)
	pos(e.point)
	k= JSON.parse(JSON.stringify({'event': 'sendMapData', 'data':e.point }));
	parent.postMessage(k, '*');
});

function pos(coords) {
	map.flyTo({center: coords});
    //map.setView(coords);
    if (marker) marker.remove();
	marker = new mapboxgl.Marker()
	    .setLngLat(coords)
	    .addTo(map);    
	/*marker = L.marker(coords, {
	  icon: L.mapbox.marker.icon({
	    'marker-color': '#f86767'
	  })
	}).addTo(map);	  */
}
</script>
</body>
</html>
