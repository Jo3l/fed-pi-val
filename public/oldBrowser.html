<!DOCTYPE html>
<html lang='es' class=''>
<head>
<meta charset='UTF-8'>
<meta name="robots" content="noindex">

<style>
.old-browsers {
  position: relative;
  background: #fff;
  width: 100%;
  height: 100%;
  color: black;
  font-family: sans-serif;
  font-size: 20px;
  text-align: center;
  padding: 0;
  margin: 100px 0 0 0;
}
.old-browsers h2 {
  padding: 20px 0 20px 0;
}
.old-browsers p, .old-browsers ul {
  margin: 0 auto;
}
.old-browsers p {
  max-width: 700px;
  padding-bottom: 50px;
  line-height: 1.4em;
}
.old-browsers ul li {
  display: inline-block;
  padding: 0 25px;
}
.old-browsers ul li img {
  width: 115px;
  border: 0;
}
.old-browsers ul li p {
  padding-top: 15px;
}

body {
  margin: 0;
  padding: 0;
}
</style>
</head>
<body>
<div class="old-browsers">
  <h2>¡Navegador Obsoleto!</h2>
  <p>Parece que tu navegador es muy viejo y no soporta las funcionalidades modernas de cualquier sitio web moderno. Te recomendamos que actualices tu navegador, por favor usa los siguientes links:</p>
  <ul>
    <li>
      <a href="https://www.google.com/intl/en/chrome/browser/desktop/index.html#brand=CHMB&utm_campaign=en&utm_source=en-ha-na-us-sk&utm_medium=ha">
        <img src="https://kni-labs.github.io/old-browsers/img/chrome_128x128.png" alt="Google Chrome">
        <p>Google Chrome</p>
      </a>
    </li>
    <li>
      <a href="https://www.mozilla.org/en-US/firefox/new/">
        <img src="https://kni-labs.github.io/old-browsers/img/firefox_128x128.png" alt="Mozilla Firefox">
        <p>Mozilla Firefox</p>
      </a>
    </li>
    <li>
      <a href="https://www.microsoft.com/en-us/windows/microsoft-edge">
        <img src="https://kni-labs.github.io/old-browsers/img/edge_128x128.png" alt="Internet Explorer">
        <p>Microsoft Edge</p>
      </a>
    </li>
  </ul>
</div>

</body>
</html>
